name: Feature request
description: Something these libraries should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do, and where does the library stop you? Describe
        the situation rather than the API you have in mind -- the shape of the
        solution is easier to agree on once the problem is clear.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: If you have a concrete proposal, sketch it. Code is welcome.
    validations:
      required: true

  - type: input
    id: standard
    attributes:
      label: Relevant standard
      description: >
        The RFC, ITU-T recommendation or vendor document that defines the
        behaviour, if there is one. These libraries implement standards; a
        request backed by one is much easier to accept.
      placeholder: RFC 7860, section 4

  - type: textarea
    id: alternatives
    attributes:
      label: What you are doing instead today
      description: The workaround, if you have one. It tells us how urgent this is.
