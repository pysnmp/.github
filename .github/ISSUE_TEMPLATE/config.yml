# A question is not a defect, and the two need different first replies. The
# links below take the most common non-bug traffic before it becomes an issue
# somebody has to triage.
blank_issues_enabled: false
contact_links:
  - name: Documentation
    url: https://pysnmp.github.io/
    about: Guides, API reference and runnable examples for every project here.
  - name: Report a security vulnerability
    url: https://github.com/pysnmp/.github/blob/main/SECURITY.md
    about: Privately, through a security advisory -- never as a public issue.
  - name: MIB archive
    url: https://pysnmp.github.io/mibs/asn1/
    about: Looking for a MIB module? Check here before opening an issue.
