# What this organization maintains, and the single place it is written down.
#
# tools/render_profile.py turns this into the project table in
# profile/README.md -- the page GitHub shows on github.com/pysnmp -- and CI
# runs it with --check, so a project added here but not rendered fails the
# build rather than leaving the org profile a version behind.
#
# Order is the order the table lists them, and it is deliberate: pysnmp and
# mibs are what people install and use. pysmi and pyasn1 are underneath, and
# are reached through pysnmp unless you are compiling MIBs outside an engine
# or using ASN.1 for something that is not SNMP.

[[project]]
name = "pysnmp"
repo = "pysnmp/pysnmp"
distribution = "pysnmplib"
docs = "https://pysnmp.github.io/pysnmp/"
summary = "The engine. SNMP v1, v2c and v3 as manager, agent or proxy, on asyncio."

[[project]]
name = "mibs"
repo = "pysnmp/mibs"
# A distribution, but not one pip resolves: use it live over HTTPS, or install
# it locally from the archive or an OCI image. `install` overrides the pip
# command the table would otherwise build from `distribution`.
install = "live over HTTPS, or installed locally"
docs = "https://pysnmp.github.io/mibs/asn1/"
summary = "The MIB distribution -- what lets an engine say ifOperStatus rather than .1.8.1."

[[project]]
name = "pysmi"
repo = "pysnmp/pysmi"
distribution = "pysnmp-pysmi"
docs = "https://pysnmp.github.io/pysmi/"
summary = "The MIB compiler. ASN.1 sources into pysnmp modules or JSON; comes with the compile extra."

[[project]]
name = "pyasn1"
repo = "pysnmp/pyasn1"
distribution = "pysnmp-pyasn1"
docs = "https://pysnmp.github.io/pyasn1/"
summary = "The codec. ASN.1 types with BER, CER and DER, underneath both of the above."
